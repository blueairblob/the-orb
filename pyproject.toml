[project]
name = "the-orb"
version = "0.1.0"
description = "The Orb — audio-first AI Dungeon Master engine (Phase 1 desktop prototype)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "litert-lm>=0.1.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
orb-harness = "experiments.harness.cli:main"
orb-engine = "engine.loop:main"
orb-web = "experiments.web.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pexpect>=4.9.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments", "engine"]
