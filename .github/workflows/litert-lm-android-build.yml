name: LiteRT-LM Android arm64 build

# Cross-compiles google-ai-edge/LiteRT-LM's litert_lm_main for a real Android
# device (arm64-v8a). This host (aarch64 OCI VM) can't run the Android NDK's
# host toolchain, which Google ships only for linux-x86_64/macOS/Windows — see
# spike/README.md and the 2026-09-09 devlog. Runs the build on a free x86_64
# GitHub-hosted runner instead; the resulting binary targets Android arm64
# regardless of the build host's own architecture. Trigger manually, then pull
# the `litert_lm_main` artifact and adb push it to the phone per
# https://github.com/google-ai-edge/LiteRT-LM/blob/main/docs/getting-started/build-and-run.md
on:
  workflow_dispatch:
    inputs:
      litert_lm_ref:
        description: "google-ai-edge/LiteRT-LM ref to build (branch, tag, or commit)"
        type: string
        default: main

jobs:
  build-android-arm64:
    name: Build litert_lm_main (android_arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f || true
          df -h /

      - name: Checkout google-ai-edge/LiteRT-LM
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          ref: ${{ inputs.litert_lm_ref }}
          lfs: true

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update && sudo apt-get install -yq \
            build-essential clang cmake pkg-config \
            openjdk-17-jdk-headless git wget curl unzip tar \
            python3 python3-dev python3-pip \
            zlib1g-dev libssl-dev libpng-dev libcurl4-openssl-dev libfftw3-dev

      - name: Install Bazelisk
        run: |
          sudo curl -fsSL -o /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
          bazelisk version

      - name: Install Android SDK (platform-tools + build-tools)
        run: |
          export ANDROID_HOME=/opt/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -qO cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm cmdline-tools.zip
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Android NDK r28b
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: false

      - name: Export NDK home
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Cache Bazel output/repo cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: litert-lm-android-arm64-bazel-${{ hashFiles('**/WORKSPACE', '**/.bazelrc', '**/BUILD*') }}
          restore-keys: |
            litert-lm-android-arm64-bazel-

      - name: Build litert_lm_main for android_arm64
        run: |
          bazelisk build \
            --disk_cache=~/.cache/bazel --repository_cache=~/.cache/bazel/repo \
            --config=android_arm64 -c opt \
            //runtime/engine:litert_lm_main

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp bazel-bin/runtime/engine/litert_lm_main out/
          cp prebuilt/android_arm64/*.so out/

      - name: Upload litert_lm_main (android_arm64)
        uses: actions/upload-artifact@v4
        with:
          name: litert_lm_main-android_arm64
          path: out/
          retention-days: 14
